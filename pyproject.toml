[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "re-entry"
version = "0.1.0"
description = "RE:ENTRY — a human-governed AI recovery agent for crisis paperwork"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "EF-Code" }]
dependencies = [
  # Direct dependencies are pinned; transitive hashes are tracked as a
  # production follow-up in docs/production-checklist.md.
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "strands-agents==1.55.1",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.7",
]
live = [
  "boto3==1.43.93",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
