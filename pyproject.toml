[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "re-entry"
version = "0.1.0"
description = "RE:ENTRY — a human-governed AI recovery agent for crisis paperwork"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "EF-Code" }]
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.20",
  "strands-agents>=1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "bandit>=1.8.0",
  "pip-audit>=2.9.0",
  "pytest>=8.3.0",
  "ruff>=0.12.0",
]
live = [
  "boto3>=1.40.0",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
