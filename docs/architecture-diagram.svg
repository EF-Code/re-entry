<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">RE:ENTRY architecture</title>
  <desc id="desc">Human-governed recovery planning architecture using a React desk, FastAPI runtime, Strands coordinator, deterministic safety gate, human approval, mock connectors, and a future Bedrock AgentCore deployment seam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97370"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fca5a5"/>
    </marker>
    <style>
      .title { font: 800 42px Inter, Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .eyebrow { font: 700 13px Inter, Arial, sans-serif; fill: #fda4af; letter-spacing: 2px; }
      .box-title { font: 800 22px Inter, Arial, sans-serif; fill: #f8fafc; }
      .box-copy { font: 400 15px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .pill { font: 700 13px Inter, Arial, sans-serif; fill: #e0f2fe; letter-spacing: .5px; }
      .section { font: 800 16px Inter, Arial, sans-serif; fill: #fde68a; letter-spacing: 1.5px; }
      .small { font: 400 13px Inter, Arial, sans-serif; fill: #94a3b8; }
      .line { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-accent { stroke: #fca5a5; stroke-width: 3; fill: none; marker-end: url(#arrowAccent); }
      .dashed { stroke-dasharray: 10 9; }
    </style>
  </defs>

  <rect width="1800" height="1120" rx="34" fill="url(#bg)"/>
  <circle cx="1660" cy="90" r="220" fill="#312e81" opacity=".22"/>
  <circle cx="120" cy="1030" r="260" fill="#7f1d1d" opacity=".14"/>

  <text x="86" y="92" class="eyebrow">RE:ENTRY · HUMAN-GOVERNED RECOVERY</text>
  <text x="86" y="148" class="title">From crisis paperwork to safe, inspectable action</text>
  <text x="86" y="184" class="subtitle">The agent proposes from evidence. Deterministic policy and a person control every consequential side effect.</text>

  <!-- Main flow -->
  <rect x="82" y="250" width="270" height="188" rx="22" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="112" y="292" class="eyebrow">SURFACE</text>
  <text x="112" y="330" class="box-title">React recovery desk</text>
  <text x="112" y="365" class="box-copy">Evidence drawer · action queue</text>
  <text x="112" y="389" class="box-copy">timeline · Agent Path · audit view</text>
  <rect x="112" y="405" width="126" height="24" rx="12" fill="#1d4ed8"/>
  <text x="175" y="422" text-anchor="middle" class="pill">JUDGE-FACING UI</text>

  <rect x="450" y="250" width="300" height="188" rx="22" fill="#164e63" stroke="#67e8f9" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="292" class="eyebrow">RUNTIME</text>
  <text x="480" y="330" class="box-title">FastAPI HTTP boundary</text>
  <text x="480" y="365" class="box-copy">bounded JSON and multipart input</text>
  <text x="480" y="389" class="box-copy">health · plan-only /invocations</text>
  <rect x="480" y="405" width="140" height="24" rx="12" fill="#0e7490"/>
  <text x="550" y="422" text-anchor="middle" class="pill">NO SIDE EFFECTS</text>

  <rect x="846" y="210" width="430" height="270" rx="22" fill="#312e81" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="878" y="252" class="eyebrow">ORCHESTRATION</text>
  <text x="878" y="290" class="box-title">Strands coordinator</text>
  <rect x="878" y="315" width="184" height="58" rx="14" fill="#4338ca"/>
  <text x="970" y="340" text-anchor="middle" class="box-copy">Evidence Extractor</text>
  <text x="970" y="360" text-anchor="middle" class="small">normalise + cite</text>
  <rect x="1076" y="315" width="184" height="58" rx="14" fill="#4338ca"/>
  <text x="1168" y="340" text-anchor="middle" class="box-copy">Requirements Planner</text>
  <text x="1168" y="360" text-anchor="middle" class="small">bounded AgentPlan</text>
  <rect x="878" y="392" width="184" height="58" rx="14" fill="#4338ca"/>
  <text x="970" y="417" text-anchor="middle" class="box-copy">Drafting Verifier</text>
  <text x="970" y="437" text-anchor="middle" class="small">flag conflicts</text>
  <rect x="1076" y="392" width="184" height="58" rx="14" fill="#4338ca"/>
  <text x="1168" y="417" text-anchor="middle" class="box-copy">Structured output</text>
  <text x="1168" y="437" text-anchor="middle" class="small">citations + warnings</text>

  <rect x="1370" y="250" width="332" height="188" rx="22" fill="#7f1d1d" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
  <text x="1400" y="292" class="eyebrow">POLICY</text>
  <text x="1400" y="330" class="box-title">Deterministic safety gate</text>
  <text x="1400" y="365" class="box-copy">risk classification · revision binding</text>
  <text x="1400" y="389" class="box-copy">approval required for consequential work</text>
  <rect x="1400" y="405" width="150" height="24" rx="12" fill="#be123c"/>
  <text x="1475" y="422" text-anchor="middle" class="pill">HUMAN AUTHORITY</text>

  <path d="M352 344 H450" class="line"/>
  <path d="M750 344 H846" class="line"/>
  <path d="M1276 344 H1370" class="line-accent"/>

  <!-- State and side effects -->
  <text x="82" y="555" class="section">STATE + EVIDENCE</text>
  <rect x="82" y="585" width="520" height="200" rx="22" fill="#0f172a" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="116" y="630" class="box-title">CaseStore · evidence graph</text>
  <text x="116" y="666" class="box-copy">six synthetic sources → citations → actions → audit</text>
  <text x="116" y="694" class="box-copy">bounded case history and per-case serialization</text>
  <text x="116" y="722" class="box-copy">uploads hashed, size-limited, and quarantined for review</text>
  <rect x="116" y="744" width="130" height="24" rx="12" fill="#334155"/>
  <text x="181" y="761" text-anchor="middle" class="pill">DEMO: IN-MEMORY</text>

  <rect x="696" y="545" width="430" height="240" rx="22" fill="#3f2d1a" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="728" y="588" class="eyebrow">CHECKPOINT</text>
  <text x="728" y="626" class="box-title">Human approval</text>
  <text x="728" y="662" class="box-copy">Reviewer sees citations, target, risk, and note.</text>
  <text x="728" y="690" class="box-copy">Approval is bound to the inspected case revision.</text>
  <text x="728" y="718" class="box-copy">One prepared action can cross the boundary.</text>
  <rect x="728" y="742" width="166" height="24" rx="12" fill="#a16207"/>
  <text x="811" y="759" text-anchor="middle" class="pill">NO AUTO-APPROVAL</text>

  <rect x="1220" y="545" width="482" height="240" rx="22" fill="#0f3d36" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="1252" y="588" class="eyebrow">OUTBOUND SANDBOX</text>
  <text x="1252" y="626" class="box-title">Seeded mock connectors</text>
  <text x="1252" y="662" class="box-copy">low-risk → receipt after approval</text>
  <text x="1252" y="690" class="box-copy">rejection → new evidence → cited replan</text>
  <text x="1252" y="718" class="box-copy">no real agency, insurer, resident, or bank contact</text>
  <rect x="1252" y="742" width="138" height="24" rx="12" fill="#047857"/>
  <text x="1321" y="759" text-anchor="middle" class="pill">DEMO CONNECTOR</text>

  <path d="M980 480 V545" class="line"/>
  <path d="M1400 438 V500 H910 V545" class="line-accent"/>
  <path d="M602 685 H696" class="line"/>
  <path d="M1126 665 H1220" class="line-accent"/>
  <path d="M1460 785 V835 H980 V785" class="line dashed"/>
  <text x="1110" y="829" class="small">receipt or rejection is written back as inspectable evidence</text>

  <!-- AWS seam -->
  <rect x="82" y="882" width="1620" height="172" rx="24" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="116" y="924" class="eyebrow">AWS DEPLOYMENT SEAM · SPECIFICATION CHECKED IN, NOT CLAIMED AS DEPLOYED</text>
  <text x="116" y="964" class="box-title">FastAPI → AgentCore Runtime</text>
  <text x="116" y="997" class="box-copy">Strands BedrockModel · DynamoDB/S3 case graph · AgentCore Gateway targets · scoped IAM · OTel/CloudWatch</text>
  <text x="116" y="1027" class="small">REENTRY_MODE=live is guarded by allowlists, bounded turns/tokens, verified-only data defaults, and the durable-store readiness gate.</text>
  <rect x="1420" y="950" width="224" height="38" rx="19" fill="url(#accent)"/>
  <text x="1532" y="975" text-anchor="middle" style="font:800 14px Inter, Arial, sans-serif;fill:#1e1b4b;letter-spacing:1px">HUMAN DECISIONS, VISIBLE</text>
</svg>
