services:
  reentry:
    build: .
    ports:
      # The demo API has no production authorizer; keep the local-only
      # synthetic case off the host's network interfaces by default.
      - "127.0.0.1:8000:8080"
    environment:
      REENTRY_MODE: demo
      REENTRY_CASE_ID: case-042
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
